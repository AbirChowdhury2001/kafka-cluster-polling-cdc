apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders-cdc
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: orders-pipeline-user
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: orders-cdc
          patternType: literal
        operations: [Read, Write, Describe]
      - resource:
          type: group
          name: orders-consumer-group
          patternType: literal
        operations: [Read]
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: kafdrop-user
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations: [Read, Describe]
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations: [Read, Describe]
